[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-ich-multiwindow-xai"
version = "1.0.0"
description = "DICOM-native multi-window deep learning and explainability for RSNA intracranial hemorrhage detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hamza Sekkat"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydicom>=2.4,<4",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66",
  "captum>=0.7,<1",
  "Pillow>=10"
]

[project.scripts]
rsna-ich-xai = "rsna_ich_xai.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
